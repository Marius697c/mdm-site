name: Données pharmacies (FINESS)

# Met à jour public/pharmacies/ depuis le fichier officiel FINESS de data.gouv.fr.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 3 * *" # le 3 de chaque mois
  push:
    paths:
      - scripts/build-pharmacies.mjs
      - .github/workflows/pharmacies-data.yml

permissions:
  contents: write

concurrency:
  group: pharmacies-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-pharmacies.mjs
      - name: Enregistrer les données si elles ont changé
        run: |
          git add public/pharmacies
          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Met à jour les données pharmacies (FINESS)"
          git push
